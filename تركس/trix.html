<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تركس المعلمين - أبو فايز</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        :root {
            --bg: #050505; --glass: rgba(20, 20, 25, 0.75); --border: rgba(255, 255, 255, 0.08);
            --blue: #3b82f6; --blue-glow: rgba(59, 130, 246, 0.4);
            --green: #10b981; --red: #ef4444; --gold: #fbbf24;
            --text: #f8fafc; --muted: #71717a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; justify-content: center; }

        .smoke-wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 0; pointer-events: none; overflow: hidden; }
        .smoke { position: absolute; bottom: -150px; background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%); border-radius: 50%; filter: blur(30px); animation: rise linear infinite; }
        @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-120dvh) scale(2.5); opacity: 0; } }

        .app { width: 100vw; max-width: 480px; height: 100dvh; margin: 0 auto; position: relative; z-index: 1; display: flex; flex-direction: column; background: rgba(5,5,5,0.6); backdrop-filter: blur(15px); }
        .view { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.3s; }
        .hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }

        /* Setup */
        .setup { padding: 30px 20px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { font-size: 42px; font-weight: 900; color: var(--blue); text-shadow: 0 0 25px var(--blue-glow); }
        .logo p { color: var(--muted); font-size: 16px; margin-top: 5px; }
        
        .main-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-btn { background: var(--glass); border: 1px solid var(--border); padding: 25px 10px; border-radius: 16px; text-align: center; font-size: 18px; font-weight: bold; color: white; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; font-weight: normal; }

        /* Custom Modals - Centered Completely */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; display: grid; place-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-box { background: #121214; border: 1px solid var(--border); border-radius: 20px; padding: 25px; width: 100%; max-width: 360px; margin: auto; transform: scale(0.9); transition: 0.3s cubic-bezier(0.2,1,0.3,1); box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 90dvh; overflow-y: auto; }
        .modal-overlay.open .modal-box { transform: scale(1); }
        .modal-title { text-align: center; color: var(--gold); font-size: 20px; margin-bottom: 20px; font-weight: bold; line-height: 1.5; }
        
        .m-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .m-btn { padding: 15px; background: rgba(255,255,255,0.05); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .m-btn.primary { background: var(--blue); box-shadow: 0 4px 15px var(--blue-glow); }
        .m-btn.danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .inputs-col { display: flex; flex-direction: column; gap: 10px; }
        .inputs-col input { padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; text-align: center; font-weight: bold; font-size: 16px; outline: none;}
        .inputs-col input:focus { border-color: var(--blue); }

        /* Header & Game UI */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--glass); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .btn-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.05); color: white; border: none; font-size: 18px; font-weight: bold; display:flex; align-items:center; justify-content:center;}
        .kingdoms { display: flex; gap: 10px; padding: 15px; overflow-x: auto; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .kingdoms::-webkit-scrollbar { display: none; }
        
        .k-btn { padding: 10px 18px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid transparent; white-space: nowrap; transition: 0.3s; font-size: 14px; font-weight: bold; }
        .k-btn.incomplete { color: var(--red); border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05); }
        .k-btn.completed { color: var(--green); border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05); }
        .k-btn.active { color: var(--gold); border-color: var(--gold); background: rgba(251, 191, 36, 0.15); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }

        .table-wrap { flex: 1; min-height: 0; padding: 10px; overflow-y: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
        th { color: var(--muted); font-size: 14px; padding: 10px; }
        td { text-align: center; padding: 16px 5px; font-weight: bold; background: var(--glass); font-size: 15px; }
        tr td:first-child { border-radius: 0 10px 10px 0; color: var(--blue); }
        tr td:last-child { border-radius: 10px 0 0 10px; }
        .tr-total td { background: rgba(59, 130, 246, 0.1); color: var(--gold); font-size: 18px; }
        .eliminated { color: var(--red) !important; text-decoration: line-through; opacity: 0.6; }

        /* Dock */
        .dock { display: flex; justify-content: space-around; padding: 15px 10px; background: var(--glass); border-top: 1px solid var(--border); flex-shrink: 0; }
        .card { width: 65px; height: 90px; background: #e2e8f0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: black; font-weight: 900; font-size: 12px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative;}
        .card:active { transform: translateY(5px); }
        .card.played { opacity: 0.4; background: #94a3b8; }
        .card.played::after { content: '✎'; position: absolute; top: 5px; right: 5px; color: rgba(0,0,0,0.5); font-size: 14px; }
        .card span { font-size: 30px; margin-bottom: 5px; }
        .red { color: #dc2626; } .black { color: #09090b; }

        /* Sijil */
        .sijil-view { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 50; display: flex; flex-direction: column; transition: transform 0.3s; transform: translateY(100%); }
        .sijil-view.open { transform: translateY(0); }
        .s-list { flex: 1; min-height: 0; overflow-y: auto; padding: 15px; }
        .s-card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .s-head { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--blue); font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .s-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .v-pos { color: var(--green); font-weight: bold; }
        .v-neg { color: var(--red); font-weight: bold; }

        /* Input Sheet Modal */
        .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; flex-direction: column; justify-content: flex-end; }
        .sheet-bg.open { opacity: 1; pointer-events: all; }
        .sheet-content { background: var(--bg); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 25px 20px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.2,1,0.3,1); max-height: 90dvh; overflow-y: auto; }
        .sheet-bg.open .sheet-content { transform: translateY(0); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
        .sheet-header h2 { color: var(--blue); font-size: 20px; font-weight: 900; }
        
        .c-tabs { display: none; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .c-tab { flex: 1; text-align: center; padding: 12px; color: var(--muted); border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .c-tab.active { background: var(--blue); color: white; }

        .counters { display: grid; gap: 15px; }
        .c-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; }
        .p-name { color: var(--muted); font-size: 15px; margin-bottom: 12px; font-weight: bold; }
        .ctrls-wrap { display: flex; flex-direction: column; gap: 10px; }
        .ctrls { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); border-radius: 30px; padding: 5px; width: 100%; }
        .btn-c { width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 24px; color: white; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn-minus { background: rgba(255,255,255,0.05); }
        .btn-plus { background: var(--blue); }
        .c-val { font-size: 24px; font-weight: 900; }
        
        /* Sharakah Fill Rest Button */
        .btn-rest { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); padding: 10px; border-radius: 12px; font-weight: bold; font-size: 15px; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 5px;}
        .btn-rest:active { background: rgba(16, 185, 129, 0.3); }

        .trix-grid { display: none; flex-direction: column; gap: 10px; }
        .trix-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.03); border-radius: 12px; }
        .ranks { display: flex; gap: 5px; }
        .r-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: white; font-weight: bold; }
        .r-btn.active { background: var(--gold); color: black; border-color: var(--gold); }
        .trix-sharakah-wrap { display: none; text-align: center; }
        .ts-score { font-size: 36px; font-weight: 900; color: var(--gold); margin: 15px 0; }
        
        .save-btn { width: 100%; padding: 18px; margin-top: 25px; border-radius: 14px; background: var(--green); color: white; font-weight: 900; font-size: 18px; border: none; transition: 0.3s; flex-shrink: 0; }
        .save-btn:disabled { background: #27272a; color: #52525b; pointer-events: none; }

        /* Analytics */
        .stat-card { padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent;}
        .stat-card.gold { background: rgba(251, 191, 36, 0.1); border-color: var(--gold); color: var(--gold); }
        .stat-card.red { background: rgba(239, 68, 68, 0.1); border-color: var(--red); color: #fca5a5; }
        .stat-row { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; display: flex; justify-content: space-between;}
        .stat-row span { font-weight: bold; color: var(--blue); }
    </style>
</head>
<body>

    <div class="smoke-wrap" id="smoke-wrap"></div>

    <div class="app">
        <!-- View 1: Setup -->
        <div id="view-setup" class="view">
            <div class="setup">
                <div class="logo">
                    <h1>تركس المعلمين</h1>
                    <p>الحفظ التلقائي شغال 💾</p>
                </div>
                
                <div class="main-menu">
                    <div class="menu-btn" onclick="openTadbeelModal('yahoudi', 'normal')">تركس يهودي<span>4 لاعبين</span></div>
                    <div class="menu-btn" onclick="openTadbeelModal('sharakah', 'normal')">تركس شراكة<span>فريقين</span></div>
                    <div class="menu-btn" onclick="openTadbeelModal('yahoudi', 'complex')">كومبلكس يهودي<span>4 لاعبين</span></div>
                    <div class="menu-btn" onclick="openTadbeelModal('sharakah', 'complex')">كومبلكس شراكة<span>فريقين</span></div>
                </div>
            </div>
        </div>

        <!-- View 2: Game -->
        <div id="view-game" class="view hidden">
            <div class="header">
                <button class="btn-icon" style="color:var(--muted)" onclick="toggleSijil(true)">سجل</button>
                <h2 style="font-size: 18px; color: var(--gold);" id="game-title">النقاط</h2>
                <button class="btn-icon" style="color:var(--red); font-size: 12px;" onclick="confirmNewGame()">مسح</button>
            </div>
            <div class="kingdoms" id="kingdoms"></div>
            <div class="table-wrap">
                <table>
                    <thead><tr id="th-row"></tr></thead>
                    <tbody id="tb-body"></tbody>
                </table>
            </div>
            <div class="dock" id="dock"></div>
        </div>

        <!-- Sijil View -->
        <div class="sijil-view" id="view-sijil">
            <div class="header">
                <button class="btn-icon" onclick="toggleSijil(false)">×</button>
                <h2 style="font-size: 18px; color: var(--blue);">سجل المباريات</h2>
                <div style="width: 40px;"></div>
            </div>
            <div class="s-list" id="sijil-list"></div>
        </div>

        <!-- Modals Container -->
        <div class="modal-overlay" id="modals-container">
            
            <!-- Custom Confirm Modal -->
            <div class="modal-box hidden" id="modal-confirm">
                <div class="modal-title" id="confirm-title" style="color: white; font-size: 18px;">متأكد؟</div>
                <div class="m-btns" style="margin-top: 25px;">
                    <button class="m-btn" style="background: rgba(255,255,255,0.05);" onclick="closeModal('modal-confirm')">إلغاء</button>
                    <button class="m-btn danger" id="confirm-yes-btn">تأكيد</button>
                </div>
            </div>

            <!-- Tadbeel -->
            <div class="modal-box hidden" id="modal-tadbeel">
                <div class="modal-title">نوع الحسبة</div>
                <div class="m-btns">
                    <button class="m-btn" onclick="selectTadbeel(false)">عادية</button>
                    <button class="m-btn" style="color: var(--gold); border: 1px solid var(--gold);" onclick="selectTadbeel(true)">تدبيل</button>
                </div>
            </div>

            <!-- Names -->
            <div class="modal-box hidden" id="modal-names">
                <div class="modal-title" id="names-title">أسماء اللاعبين</div>
                <div class="inputs-col" id="names-inputs"></div>
                <button class="m-btn primary" style="width:100%; margin-top:15px;" onclick="startGame()">ابدأ اللعبة</button>
            </div>

            <!-- Action (Banat/Khetyar) -->
            <div class="modal-box hidden" id="modal-action">
                <div class="modal-title" id="action-title">الكرت لـ فلان</div>
                <div class="m-btns" id="action-step1">
                    <button class="m-btn" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;" onclick="resolveAction(false)">عادية</button>
                    <button class="m-btn" style="background: rgba(251, 191, 36, 0.2); color: var(--gold);" onclick="showDoublers()">مدبلة</button>
                </div>
                <div class="inputs-col hidden" id="action-step2">
                    <div style="text-align:center; color:white; margin-bottom: 10px;">لصالح مين؟</div>
                    <div class="m-btns" id="doubler-btns"></div>
                </div>
            </div>

            <!-- Analytics -->
            <div class="modal-box hidden" id="modal-analytics">
                <div class="modal-title" style="font-size: 26px;">انتهت المعركة 🏁</div>
                <div id="analytics-body"></div>
                <button class="m-btn primary" style="width:100%; margin-top:20px;" onclick="confirmNewGame()">لعبة جديدة</button>
            </div>
        </div>

        <!-- Input Sheet Modal -->
        <div class="sheet-bg" id="sheet">
            <div class="sheet-content">
                <div class="sheet-header">
                    <h2 id="sheet-title">تسجيل</h2>
                    <div>
                        <button class="btn-icon" style="display:inline-flex; color:var(--gold); margin-left: 10px;" onclick="resetCurrentGame()">🔄</button>
                        <button class="btn-icon" style="display:inline-flex;" onclick="closeSheet()">×</button>
                    </div>
                </div>
                
                <div class="c-tabs" id="complex-tabs">
                    <div class="c-tab active" id="tab-latosh" onclick="switchTab('latosh')">لطوش</div>
                    <div class="c-tab" id="tab-dinari" onclick="switchTab('dinari')">ديناري</div>
                    <div class="c-tab" id="tab-banat" onclick="switchTab('banat')">بنات</div>
                    <div class="c-tab" id="tab-khetyar" onclick="switchTab('khetyar')">ختيار</div>
                </div>

                <div class="counters" id="counters"></div>
                <div class="trix-grid" id="trix-grid"></div>
                <div class="trix-sharakah-wrap" id="trix-sharakah">
                    <div class="p-name" id="ts-t1-name">الفريق 1</div>
                    <div class="ctrls" style="justify-content: center; gap: 20px; background: transparent;">
                        <button class="btn-c btn-minus" onclick="changeTs(-50)">-</button>
                        <div class="ts-score" id="ts-t1-val">250</div>
                        <button class="btn-c btn-plus" onclick="changeTs(50)">+</button>
                    </div>
                    <div class="p-name" id="ts-t2-name" style="margin-top: 15px;">الفريق 2: <span>250</span></div>
                </div>

                <button class="save-btn" id="save-btn" onclick="saveData()">حفظ الجولة</button>
            </div>
        </div>
    </div>

    <script>
        let wakeLock = null;
        async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        document.addEventListener('visibilitychange', () => { if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock(); });
        requestWakeLock();

        const smokeWrap = document.getElementById('smoke-wrap');
        for(let i=0; i<5; i++) {
            let div = document.createElement('div'); div.className = 'smoke';
            div.style.left = `${Math.random() * 100}vw`; div.style.width = div.style.height = `${100 + Math.random() * 200}px`;
            div.style.animationDuration = `${12 + Math.random() * 10}s`; div.style.animationDelay = `-${Math.random() * 10}s`;
            smokeWrap.appendChild(div);
        }

        let cfg = { mode: '', style: '', tadbeel: false };
        let names = []; 
        let curKingdom = 1;
        let curGame = ''; 
        let curTab = '';
        let scores = [{}, {}, {}, {}]; 
        let eliminated = [false, false, false, false];
        let logs = []; 

        const rules = {
            'latosh': { name: 'لطوش', max: 13, v: -15 }, 'dinari': { name: 'ديناري', max: 13, v: -10 },
            'banat': { name: 'بنات', max: 4, v: -25, dv: -50, db: 25 }, 'khetyar': { name: 'ختيار', max: 1, v: -75, dv: -150, db: 75 },
            'trix': { name: 'تركس', max: 0 }
        };

        let inputsData = {};
        let pendingAction = { game: '', eIdx: 0 };
        let sharakahTrixVal = 250;

        function haptic() { if(navigator.vibrate) navigator.vibrate(20); }

        function saveStateToLocal() {
            const state = { cfg, names, curKingdom, scores, eliminated, logs };
            localStorage.setItem('trix_vip_state', JSON.stringify(state));
        }

        function loadStateFromLocal() {
            const saved = localStorage.getItem('trix_vip_state');
            if(saved) {
                const state = JSON.parse(saved);
                cfg = state.cfg; names = state.names; curKingdom = state.curKingdom;
                scores = state.scores; eliminated = state.eliminated; logs = state.logs;
                document.getElementById('view-setup').classList.add('hidden');
                document.getElementById('view-game').classList.remove('hidden');
                buildUI();
            }
        }
        window.onload = loadStateFromLocal;

        let confirmAction = null;
        function showConfirm(msg, onYes) {
            haptic();
            document.getElementById('confirm-title').innerText = msg;
            confirmAction = onYes;
            openModal('modal-confirm');
        }
        document.getElementById('confirm-yes-btn').onclick = () => {
            haptic();
            closeModal('modal-confirm');
            if(confirmAction) confirmAction();
        };

        function confirmNewGame() {
            showConfirm('متأكد بدك تمسح السهرة الحالية وتبلش على نضيف؟', () => {
                localStorage.removeItem('trix_vip_state');
                location.reload();
            });
        }

        function resetCurrentGame() {
            showConfirm('تصفير العدادات لإعادة تسجيل هالجولة؟', () => {
                inputsData = { 'latosh': [], 'dinari': [], 'banat': [], 'khetyar': [], 'trix': cfg.mode==='yahoudi' ? [0,0,0,0] : [] };
                sharakahTrixVal = 250;
                if(curGame === 'trix') { if(cfg.mode === 'yahoudi') refreshTrixUI(); else updateTsUi(); }
                else buildCounters();
                validateSave();
            });
        }

        function openModal(id) {
            document.getElementById('modals-container').classList.add('open');
            document.querySelectorAll('.modal-box').forEach(b => b.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if(document.querySelectorAll('.modal-box:not(.hidden)').length === 0) document.getElementById('modals-container').classList.remove('open');
        }

        function openTadbeelModal(mode, style) { haptic(); cfg.mode = mode; cfg.style = style; openModal('modal-tadbeel'); }
        function selectTadbeel(val) { haptic(); cfg.tadbeel = val; closeModal('modal-tadbeel'); buildNamesInput(); openModal('modal-names'); }

        function buildNamesInput() {
            let wrap = document.getElementById('names-inputs'); wrap.innerHTML = '';
            document.getElementById('names-title').innerText = cfg.mode === 'yahoudi' ? 'أسماء الـ 4 لاعبين' : 'أسماء الفريقين';
            let count = cfg.mode === 'yahoudi' ? 4 : 2;
            let defs = cfg.mode === 'yahoudi' ? ['أنا', 'أبو خالد', 'رامي', 'سامر'] : ['فريقي', 'فريق الخصم'];
            for(let i=0; i<count; i++) wrap.innerHTML += `<input type="text" id="p${i}" value="${defs[i]}">`;
        }

        function startGame() {
            haptic(); names = [];
            let count = cfg.mode === 'yahoudi' ? 4 : 2;
            for(let i=0; i<count; i++) names.push(document.getElementById(`p${i}`).value || `لاعب/فريق ${i+1}`);
            
            let gamesList = cfg.style === 'complex' ? ['complex', 'trix'] : ['latosh', 'dinari', 'banat', 'khetyar', 'trix'];
            for(let k=0; k<4; k++) gamesList.forEach(g => scores[k][g] = null);

            saveStateToLocal();
            closeModal('modal-names');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-game').classList.remove('hidden');
            buildUI();
        }

        function buildUI() {
            let kb = document.getElementById('kingdoms'); kb.innerHTML = '';
            let gamesList = cfg.style === 'complex' ? ['complex', 'trix'] : ['latosh', 'dinari', 'banat', 'khetyar', 'trix'];
            
            for(let i=1; i<=4; i++) {
                let owner = cfg.mode === 'yahoudi' ? names[i-1] : (i%2 !== 0 ? names[0] : names[1]);
                let kScores = scores[i-1];
                let playedCount = gamesList.filter(g => kScores[g] !== null).length;
                let statusClass = playedCount === gamesList.length ? 'completed' : 'incomplete';
                if (i === curKingdom) statusClass = 'active';

                let b = document.createElement('div'); b.className = `k-btn ${statusClass}`;
                b.innerText = `مملكة ${i} (${owner})`; b.onclick = () => { haptic(); curKingdom = i; buildUI(); };
                kb.appendChild(b);
            }

            let th = document.getElementById('th-row'); th.innerHTML = '<th>الطلب</th>';
            names.forEach((n, i) => th.innerHTML += `<th class="${eliminated[i] ? 'eliminated' : ''}">${n.split(' ')[0]}</th>`);

            let tb = document.getElementById('tb-body'); tb.innerHTML = '';
            let sums = cfg.mode === 'yahoudi' ? [0,0,0,0] : [0,0];

            gamesList.forEach(g => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${g==='complex' ? 'كومبلكس' : rules[g].name}</td>`;
                let s = scores[curKingdom-1][g]; 
                if(s) {
                    s.pts.forEach((v,i) => { tr.innerHTML += `<td class="${eliminated[i] ? 'eliminated' : ''}">${v}</td>`; sums[i]+=v; });
                } else {
                    names.forEach((_,i) => tr.innerHTML += `<td class="${eliminated[i] ? 'eliminated' : ''}">-</td>`);
                }
                tb.appendChild(tr);
            });

            let trTotal = document.createElement('tr'); trTotal.className = 'tr-total'; trTotal.innerHTML = '<td>المجموع</td>';
            sums.forEach((v,i) => trTotal.innerHTML += `<td class="${eliminated[i] ? 'eliminated' : ''}">${v}</td>`);
            tb.appendChild(trTotal);

            let dock = document.getElementById('dock'); dock.innerHTML = '';
            if(cfg.style === 'complex') { addCard('complex', '🃏', 'كومبلكس', 'black'); addCard('trix', 'J♠', 'تركس', 'black'); } 
            else { addCard('banat', '👸♠', 'بنات', 'black'); addCard('khetyar', '🤴♥', 'ختيار', 'red'); addCard('dinari', 'A♦', 'ديناري', 'red'); addCard('latosh', '🃏', 'لطوش', 'black'); addCard('trix', 'J♠', 'تركس', 'black'); }
            
            checkGameEnd();
        }

        function addCard(k, icon, lbl, cls) {
            let played = scores[curKingdom-1][k] !== null;
            let div = document.createElement('div'); div.className = `card ${played ? 'played' : ''}`;
            div.innerHTML = `<span class="${cls}">${icon}</span><div>${lbl}</div>`;
            div.onclick = () => openInput(k);
            document.getElementById('dock').appendChild(div);
        }

        function openInput(k) {
            haptic(); curGame = k;
            if(scores[curKingdom-1][k] !== null) {
                inputsData = JSON.parse(JSON.stringify(scores[curKingdom-1][k].rawInputs));
                if(k === 'trix' && cfg.mode === 'sharakah') sharakahTrixVal = scores[curKingdom-1][k].pts[0];
            } else {
                inputsData = { 'latosh': [], 'dinari': [], 'banat': [], 'khetyar': [], 'trix': cfg.mode==='yahoudi' ? [0,0,0,0] : [] };
                sharakahTrixVal = 250;
            }

            document.getElementById('sheet').classList.add('open');
            document.getElementById('complex-tabs').style.display = (k === 'complex') ? 'flex' : 'none';

            let cDiv = document.getElementById('counters'); let tGrid = document.getElementById('trix-grid'); let tShar = document.getElementById('trix-sharakah');
            cDiv.style.display = 'none'; tGrid.style.display = 'none'; tShar.style.display = 'none';

            if(k === 'trix') {
                document.getElementById('sheet-title').innerText = 'تسجيل: تركس';
                if(cfg.mode === 'yahoudi') { tGrid.style.display = 'flex'; buildTrixGrid(); }
                else { tShar.style.display = 'block'; document.getElementById('ts-t1-name').innerText = names[0]; updateTsUi(); }
            } else {
                cDiv.style.display = 'grid'; cDiv.style.gridTemplateColumns = cfg.mode === 'yahoudi' ? '1fr 1fr' : '1fr';
                if(k === 'complex') { document.getElementById('sheet-title').innerText = 'تسجيل: كومبلكس'; switchTab('latosh'); } 
                else { document.getElementById('sheet-title').innerText = `تسجيل: ${rules[k].name}`; curTab = k; buildCounters(); }
            }
            validateSave();
        }

        function closeSheet() { haptic(); document.getElementById('sheet').classList.remove('open'); }
        
        function switchTab(t) { 
            haptic(); 
            curTab = t; 
            document.querySelectorAll('.c-tab').forEach(el => el.classList.remove('active')); 
            document.getElementById('tab-' + t).classList.add('active'); 
            buildCounters(); 
        }

        function buildCounters() {
            let cDiv = document.getElementById('counters'); cDiv.innerHTML = '';
            let max = rules[curTab].max;
            let totalCards = inputsData[curTab].length;
            let rem = max - totalCards;

            names.forEach((n, i) => {
                let count = inputsData[curTab].filter(ev => ev.e === i).length;
                let restBtnHtml = '';
                
                if (cfg.mode === 'sharakah' && rem > 0 && totalCards > 0) {
                    restBtnHtml = `<button class="btn-rest" onclick="fillRest(${i})">إضافة الباقي (${rem}) ✔️</button>`;
                }

                cDiv.innerHTML += `
                    <div class="c-box">
                        <div class="p-name">${n}</div>
                        <div class="ctrls-wrap">
                            <div class="ctrls">
                                <button class="btn-c btn-minus" onclick="changeCount(${i}, -1)">-</button>
                                <span class="c-val">${count}</span>
                                <button class="btn-c btn-plus" onclick="changeCount(${i}, 1)">+</button>
                            </div>
                            ${restBtnHtml}
                        </div>
                    </div>`;
            });
            validateSave();
        }

        function changeCount(pIdx, delta) {
            if(delta > 0) {
                if(inputsData[curTab].length < rules[curTab].max) {
                    if(cfg.tadbeel && (curTab === 'banat' || curTab === 'khetyar')) { startAction(pIdx); return; }
                    haptic(); inputsData[curTab].push({e: pIdx, d: null});
                }
            } else {
                let arr = inputsData[curTab];
                for(let i=arr.length-1; i>=0; i--) { if(arr[i].e === pIdx) { arr.splice(i, 1); haptic(); break; } }
            }
            buildCounters();
        }

        function fillRest(pIdx) {
            haptic();
            let max = rules[curTab].max;
            let rem = max - inputsData[curTab].length;
            for(let i=0; i<rem; i++) {
                inputsData[curTab].push({e: pIdx, d: null});
            }
            buildCounters();
        }

        function startAction(pIdx) { haptic(); pendingAction = { game: curTab, eIdx: pIdx }; document.getElementById('action-title').innerText = `${rules[curTab].name} لـ (${names[pIdx].split(' ')[0]})`; document.getElementById('action-step1').classList.remove('hidden'); document.getElementById('action-step2').classList.add('hidden'); openModal('modal-action'); }
        function resolveAction(isMdabbal) { haptic(); if(!isMdabbal) { inputsData[pendingAction.game].push({ e: pendingAction.eIdx, d: null }); closeModal('modal-action'); buildCounters(); } }
        function showDoublers() {
            haptic();
            if(cfg.mode === 'sharakah') { let otherTeamIdx = pendingAction.eIdx === 0 ? 1 : 0; inputsData[pendingAction.game].push({ e: pendingAction.eIdx, d: otherTeamIdx }); closeModal('modal-action'); buildCounters(); } 
            else {
                document.getElementById('action-step1').classList.add('hidden'); let wrap = document.getElementById('doubler-btns'); wrap.innerHTML = '';
                names.forEach((n, i) => { if(i !== pendingAction.eIdx) wrap.innerHTML += `<button class="m-btn primary" onclick="finishAction(${i})">${n.split(' ')[0]}</button>`; });
                document.getElementById('action-step2').classList.remove('hidden');
            }
        }
        function finishAction(dIdx) { haptic(); inputsData[pendingAction.game].push({ e: pendingAction.eIdx, d: dIdx }); closeModal('modal-action'); buildCounters(); }

        function buildTrixGrid() {
            let tg = document.getElementById('trix-grid'); tg.innerHTML = '';
            names.forEach((n, i) => { tg.innerHTML += `<div class="trix-row"><span style="color:var(--muted); font-weight:bold;">${n}</span><div class="ranks">${[1,2,3,4].map(r => `<button class="r-btn r${r}" onclick="setRank(${i}, ${r})">${r}</button>`).join('')}</div></div>`; });
            refreshTrixUI();
        }
        function setRank(pIdx, rank) { haptic(); let oldIdx = inputsData['trix'].indexOf(rank); if(oldIdx !== -1) inputsData['trix'][oldIdx] = 0; inputsData['trix'][pIdx] = rank; refreshTrixUI(); validateSave(); }
        function refreshTrixUI() {
            document.querySelectorAll('.r-btn').forEach(b => { b.classList.remove('active'); b.style.opacity = '1'; });
            inputsData['trix'].forEach((r, pIdx) => {
                if(r > 0) {
                    document.querySelectorAll(`.trix-row:nth-child(${pIdx+1}) .r${r}`)[0].classList.add('active');
                    for(let i=0; i<4; i++) if(i!==pIdx) document.querySelectorAll(`.trix-row:nth-child(${i+1}) .r${r}`)[0].style.opacity = '0.2';
                    for(let x=1; x<=4; x++) if(x!==r) document.querySelectorAll(`.trix-row:nth-child(${pIdx+1}) .r${x}`)[0].style.opacity = '0.2';
                }
            });
        }
        function changeTs(val) { haptic(); let n = sharakahTrixVal + val; if(n >= 150 && n <= 350) sharakahTrixVal = n; updateTsUi(); validateSave(); }
        function updateTsUi() { document.getElementById('ts-t1-val').innerText = sharakahTrixVal; document.getElementById('ts-t2-name').innerHTML = `${names[1]}: <span style="color:var(--gold); font-weight:900;">${500 - sharakahTrixVal}</span>`; }

        function validateSave() {
            let valid = false;
            if(curGame === 'trix') { valid = cfg.mode === 'yahoudi' ? !inputsData['trix'].includes(0) : true; } 
            else if (curGame === 'complex') { valid = (inputsData['latosh'].length === 13 && inputsData['dinari'].length === 13 && inputsData['banat'].length === 4 && inputsData['khetyar'].length === 1); } 
            else { valid = inputsData[curGame].length === rules[curGame].max; }
            document.getElementById('save-btn').disabled = !valid;
        }

        function calcPts(g, evs) {
            let count = cfg.mode === 'yahoudi' ? 4 : 2; let pts = Array(count).fill(0); let r = rules[g];
            evs.forEach(ev => { if(ev.d !== null) { pts[ev.e] += r.dv; pts[ev.d] += r.db; } else { pts[ev.e] += r.v; } });
            return pts;
        }

        function saveData() {
            haptic();
            let count = cfg.mode === 'yahoudi' ? 4 : 2; let roundPts = Array(count).fill(0);
            let logMsg = curGame === 'complex' ? 'كومبلكس' : rules[curGame].name;

            if(curGame === 'trix') {
                if(cfg.mode === 'yahoudi') { const tv = {1: 200, 2: 150, 3: 100, 4: 50}; roundPts = inputsData['trix'].map(r => tv[r]); } 
                else { roundPts = [sharakahTrixVal, 500 - sharakahTrixVal]; }
            } else if (curGame === 'complex') {
                ['latosh', 'dinari', 'banat', 'khetyar'].forEach(g => { let subPts = calcPts(g, inputsData[g]); subPts.forEach((v, i) => roundPts[i] += v); });
            } else { roundPts = calcPts(curGame, inputsData[curGame]); }

            scores[curKingdom-1][curGame] = { pts: roundPts, rawInputs: JSON.parse(JSON.stringify(inputsData)) };
            logs = logs.filter(l => !(l.kingdom === curKingdom && l.gameId === curGame));
            logs.push({ kingdom: curKingdom, kName: cfg.mode === 'yahoudi' ? names[curKingdom-1] : (curKingdom%2 !== 0 ? names[0] : names[1]), gameId: curGame, title: logMsg, pts: roundPts });

            saveStateToLocal();
            closeSheet(); buildUI();
            setTimeout(checkElimination, 300);
        }

        function toggleSijil(show) { haptic(); let s = document.getElementById('view-sijil'); if(show) { buildSijil(); s.classList.add('open'); } else { s.classList.remove('open'); } }
        function buildSijil() {
            let list = document.getElementById('sijil-list'); list.innerHTML = '';
            if(logs.length === 0) { list.innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px;">لسا ما تلعبت ولا جولة</div>'; return; }
            [...logs].reverse().forEach(log => {
                let card = document.createElement('div'); card.className = 's-card';
                card.innerHTML = `<div class="s-head"><span>مملكة ${log.kingdom} (${log.kName})</span><span>${log.title}</span></div>`;
                names.forEach((n, i) => { let v = log.pts[i]; let vClass = v > 0 ? 'v-pos' : (v < 0 ? 'v-neg' : ''); card.innerHTML += `<div class="s-row"><span>${n.split(' ')[0]}:</span><span class="${vClass}">${v > 0 ? '+'+v : v}</span></div>`; });
                list.appendChild(card);
            });
        }

        function checkGameEnd() {
            let gamesList = cfg.style === 'complex' ? ['complex', 'trix'] : ['latosh', 'dinari', 'banat', 'khetyar', 'trix'];
            let isOver = true; for(let k=0; k<4; k++) gamesList.forEach(g => { if(!scores[k][g]) isOver = false; });
            if(isOver) setTimeout(showAnalytics, 500);
        }

        function showAnalytics() {
            haptic(); let count = cfg.mode === 'yahoudi' ? 4 : 2; let totals = Array(count).fill(0);
            let banatCount = Array(count).fill(0); let khetyarCount = Array(count).fill(0);
            let gamesList = cfg.style === 'complex' ? ['complex', 'trix'] : ['latosh', 'dinari', 'banat', 'khetyar', 'trix'];

            for(let k=0; k<4; k++) {
                gamesList.forEach(g => {
                    let s = scores[k][g]; if(!s) return;
                    s.pts.forEach((v,i) => totals[i]+=v);
                    let raw = s.rawInputs;
                    if(g === 'banat' || g === 'complex') raw.banat.forEach(ev => banatCount[ev.e]++);
                    if(g === 'khetyar' || g === 'complex') raw.khetyar.forEach(ev => khetyarCount[ev.e]++);
                });
            }

            let maxPts = Math.max(...totals); let minPts = Math.min(...totals);
            let winnerIdx = totals.indexOf(maxPts); let loserIdx = totals.indexOf(minPts);
            let maxBanat = Math.max(...banatCount); let banatKing = banatCount.indexOf(maxBanat);
            let maxK = Math.max(...khetyarCount); let khetyarKing = khetyarCount.indexOf(maxK);

            let html = `<div class="stat-card gold">👑 المعلم: ${names[winnerIdx].split(' ')[0]} <span style="font-size:14px;">(${maxPts})</span></div>`;
            if(minPts < 0) html += `<div class="stat-card red">🐴 حمار اللعبة: ${names[loserIdx].split(' ')[0]} <span style="font-size:14px;">(${minPts})</span></div>`;
            if(maxBanat > 0) html += `<div class="stat-row">💃 خاطف البنات: <span>${names[banatKing].split(' ')[0]} (${maxBanat})</span></div>`;
            if(maxK > 0) html += `<div class="stat-row">👴 صديق الختيار: <span>${names[khetyarKing].split(' ')[0]} (${maxK})</span></div>`;

            document.getElementById('analytics-body').innerHTML = html; openModal('modal-analytics');
        }

        // الفصل الذكي - الحسبة المنطقية الصح
        function checkElimination() {
            let isOver = true; let gamesList = cfg.style === 'complex' ? ['complex', 'trix'] : ['latosh', 'dinari', 'banat', 'khetyar', 'trix'];
            for(let k=0; k<4; k++) gamesList.forEach(g => { if(!scores[k][g]) isOver = false; });
            if(isOver) return; 
            
            let count = cfg.mode === 'yahoudi' ? 4 : 2; let currentTotals = Array(count).fill(0);
            for(let k=0; k<4; k++) gamesList.forEach(g => { if(scores[k][g]) scores[k][g].pts.forEach((v, i) => currentTotals[i] += v); });
            let maxScore = Math.max(...currentTotals);

            let newlyEliminated = [];
            currentTotals.forEach((total, idx) => {
                if(eliminated[idx]) return; 
                
                let maxPossibleRemaining = 0;
                for(let k=0; k<4; k++) {
                    gamesList.forEach(g => {
                        if(!scores[k][g]) {
                            // كم أقصى نقاط ممكن ياخدها اللاعب الواحد من هاللعبة
                            if(g === 'trix') maxPossibleRemaining += (cfg.mode === 'sharakah' ? 500 : 200);
                            if(g === 'banat') maxPossibleRemaining += (cfg.tadbeel ? 100 : 0);
                            if(g === 'khetyar') maxPossibleRemaining += (cfg.tadbeel ? 75 : 0);
                            if(g === 'complex') maxPossibleRemaining += (cfg.tadbeel ? 175 : 0);
                            // اللطوش والديناري ما فيهم نقط إيجابية لهيك أقصى شي صفر
                        }
                    });
                }

                let gap = maxScore - total;
                if(gap > 0 && maxPossibleRemaining < gap) { 
                    eliminated[idx] = true; 
                    newlyEliminated.push({ i: idx }); 
                }
            });

            if(newlyEliminated.length > 0) {
                haptic();
                showConfirm(`⚠️ فصلت اللعبة!\nاللاعب (${names[newlyEliminated[0].i]}) أكلها وما عاد يقدر يلحق المركز الأول مهما صار!`, null);
                saveStateToLocal(); buildUI(); 
            }
        }
    </script>
</body>
</html>
