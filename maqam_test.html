<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتشف المقامات - أبو فايز</title>
<style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    .box { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    button { padding: 15px 25px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 10px; transition: 0.2s; }
    #recordBtn { background: #cc2200; color: white; }
    #recordBtn:disabled { background: #555; cursor: not-allowed; }
    #stopBtn { background: #007a3d; color: white; display: none; }
    #result { margin-top: 25px; font-size: 1.5rem; font-weight: bold; color: #00ffcc; min-height: 50px; }
    .details { font-size: 0.9rem; color: #aaa; margin-top: 10px; white-space: pre-wrap; }
</style>
</head>
<body>

<div class="box">
    <h2>مكتشف المقامات الشرقي 🎵</h2>
    <p style="font-size: 0.9rem; color: #ccc;">(دندن الموال أو الأغنية، وتأكد إنك <b>تقفل بشكل واضح على درجة الركوز</b> بنهاية التسجيل)</p>
    
    <button id="recordBtn" onclick="startRecording()">🔴 ابدأ الدندنة</button>
    <button id="stopBtn" onclick="stopRecording()">⬛ إيقاف وتحليل</button>
    
    <div id="result">النتيجة رح تطلع هون...</div>
    <div id="details" class="details"></div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let audioCtx;

    // المقامات الـ 8 محسوبة بأرباع التون (الربع تون = 1 خطوة، الأوكتاف = 24 خطوة)
    // يعني تون كامل = 4، نصف تون = 2، تلات أرباع = 3
    const maqamat = [
        { name: 'عجم (Ajam)', intervals: [0, 4, 8, 10, 14, 18, 22] },
        { name: 'نهاوند (Nahawand)', intervals: [0, 4, 6, 10, 14, 16, 20] },
        { name: 'كرد (Kurd)', intervals: [0, 2, 6, 10, 14, 16, 20] },
        { name: 'حجاز (Hijaz)', intervals: [0, 2, 8, 10, 14, 16, 20] },
        { name: 'رست (Rast)', intervals: [0, 4, 7, 10, 14, 18, 21] },
        { name: 'بياتي (Bayati)', intervals: [0, 3, 6, 10, 14, 16, 20] },
        { name: 'صبا (Saba)', intervals: [0, 3, 6, 8, 14, 16, 20] },
        { name: 'سيكاه (Sikah)', intervals: [0, 3, 7, 11, 14, 17, 21] } 
    ];

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = processAudio;
            
            mediaRecorder.start();
            document.getElementById('recordBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('result').textContent = 'عم اسمعك...';
            document.getElementById('details').textContent = '';
        } catch (err) {
            alert('لازم تعطي صلاحية المايكروفون يا غالي!');
        }
    }

    function stopRecording() {
        if(mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(t => t.stop());
            document.getElementById('recordBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('result').textContent = 'جاري التحليل...';
        }
    }

    async function processAudio() {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        analyzeMaqam(audioBuffer);
    }

    function analyzeMaqam(buffer) {
        const data = buffer.getChannelData(0);
        const sr = buffer.sampleRate;
        const hopSize = Math.floor(sr * 0.05); // تحليل كل 50 ميلي ثانية
        const frameSize = 2048;
        
        let detectedCents = [];
        
        // استخراج الترددات باستخدام YIN
        for (let i = 0; i < data.length - frameSize; i += hopSize) {
            const frame = data.slice(i, i + frameSize);
            let rms = 0; for(let j=0; j<frameSize; j++) rms += frame[j]**2;
            rms = Math.sqrt(rms/frameSize);
            
            if (rms > 0.02) { // تجاوز الصمت
                const freq = yinDetect(frame, sr);
                if (freq > 60 && freq < 1000) {
                    // تحويل التردد لـ Cents
                    const cents = 1200 * Math.log2(freq / 440);
                    detectedCents.push(cents);
                }
            }
        }

        if(detectedCents.length < 10) {
            document.getElementById('result').textContent = 'الصوت مو واضح أو قصير كتير!';
            return;
        }

        // فلترة النغمات وتقريبها لأقرب ربع تون (50 سنت)
        let quarterTones = detectedCents.map(c => Math.round(c / 50));
        
        // استخراج درجة الركوز (من أواخر النغمات الثابتة في التسجيل)
        const tailLength = Math.min(20, quarterTones.length);
        const tail = quarterTones.slice(-tailLength);
        const rukouz = getMostFrequent(tail); // الركوز هو النغمة اللي قفل عليها

        // حساب المسافات بالنسبة لدرجة الركوز، وإزالة التكرار
        let intervals = [...new Set(quarterTones.map(qt => {
            let diff = (qt - rukouz) % 24;
            if (diff < 0) diff += 24; // توحيد ضمن أوكتاف واحد
            return diff;
        }))].sort((a,b) => a - b);

        document.getElementById('details').textContent = `الدرجات المكتشفة (أرباع التون): [${intervals.join(', ')}]`;

        // مطابقة المسافات مع المقامات
        let bestMatch = 'غير معروف';
        let highestScore = 0;

        maqamat.forEach(maqam => {
            let score = 0;
            intervals.forEach(interval => {
                if(maqam.intervals.includes(interval)) score++;
            });
            
            // نسبة التطابق
            let matchPercentage = score / maqam.intervals.length;
            if (matchPercentage > highestScore) {
                highestScore = matchPercentage;
                bestMatch = maqam.name;
            }
        });

        if (highestScore > 0.5) {
            document.getElementById('result').textContent = `المقام الأقرب: ${bestMatch} (${Math.round(highestScore * 100)}%)`;
        } else {
            document.getElementById('result').textContent = 'المقام ضايع (حاول توضّح الدندنة وتقفل صح)';
        }
    }

    // خوارزمية YIN لاكتشاف التردد (نفسها اللي ببرنامجك)
    function yinDetect(buf, sr) {
        const N = buf.length; const W = Math.floor(N/2);
        const yb = new Float32Array(W); yb[0] = 1;
        for(let t=1; t<W; t++){ let d=0; for(let j=0; j<W; j++){ const delta = buf[j] - buf[j+t]; d += delta*delta; } yb[t] = d; }
        let rs = 0; yb[0] = 1;
        for(let t=1; t<W; t++){ rs += yb[t]; yb[t] *= t/rs; }
        let t = 2;
        while(t < W) {
            if(yb[t] < 0.1) {
                while(t+1 < W && yb[t+1] < yb[t]) t++;
                const x0 = t>0 ? t-1 : t, x2 = t<W-1 ? t+1 : t;
                if(x0 === t) return sr / (yb[t] <= yb[x2] ? t : x2);
                if(x2 === t) return sr / (yb[t] <= yb[x0] ? t : x0);
                const ym1 = yb[x0], y0 = yb[t], y1 = yb[x2];
                return sr / (t + (y1-ym1)/(2*(2*y0-ym1-y1)));
            }
            t++;
        }
        return -1;
    }

    // دالة لإيجاد العنصر الأكثر تكراراً (للبحث عن الركوز)
    function getMostFrequent(arr) {
        const counts = {};
        let maxCount = 0; let maxItem = arr[0];
        for (let num of arr) {
            counts[num] = (counts[num] || 0) + 1;
            if (counts[num] > maxCount) { maxCount = counts[num]; maxItem = num; }
        }
        return maxItem;
    }
</script>
</body>
</html>
